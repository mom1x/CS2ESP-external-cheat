name: Build Windows EXE (CS2ESP)

on:
  workflow_dispatch:   # ручной запуск
  push:                # или автоматически при каждом пуше

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'   # стабильная версия

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ----- Сборка с явным включением pymem -----
      - name: Build EXE with PyInstaller
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name CS2ESP `
            --collect-all pymem `
            --hidden-import pymem.process `
            CS2ESP.py

      # ----- Публикация готового EXE -----
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CS2ESP-external
          path: dist/CS2ESP.exe

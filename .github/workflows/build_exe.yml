name: Ultimate Anonymous Compiler Pro

on:
  workflow_dispatch: # Run manually via Actions tab

jobs:
  stealth_build:
    runs-on: windows-latest

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Setup MSBuild (For C++)
      uses: microsoft/setup-msbuild@v2

    - name: 3. Setup .NET Runtime (For C#)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'

    - name: 4. Auto-Generate Clean Manifest (No UAC)
      shell: pwsh
      run: |
        $manifestContent = @"
        <?xml version="1.0" encoding="utf-8"?>
        <assembly manifestVersion="1.0" xmlns="urn:schemas-microsoft-com:asm.v1">
          <assemblyIdentity version="1.0.0.0" name="Microsoft.Windows.Runtime"/>
          <trustInfo xmlns="urn:schemas-microsoft-com:asm.v2">
            <security>
              <requestedPrivileges xmlns="urn:schemas-microsoft-com:asm.v3">
                <requestedExecutionLevel level="asInvoker" uiAccess="false" />
              </requestedPrivileges>
            </security>
          </trustInfo>
        </assembly>
        "@
        $manifestContent | Out-File -FilePath "stealth.manifest" -Encoding utf8
        Write-Host "Stealth manifest successfully generated."

    - name: 5. Detect and Compile Project (Anonymized)
      shell: pwsh
      run: |
        $project = Get-ChildItem -Path . -Include *.sln, *.csproj, *.vcxproj -Recurse | Select-Object -First 1
        if (-not $project) {
            Write-Error "Critical Error: Project file (.sln, .csproj, .vcxproj) not found!"
            exit 1
        }
        
        Write-Host "Found target project: $($project.FullName)"
        Write-Host "Starting anonymized compilation..."

        if ($project.Extension -eq ".csproj" -or ($project.Extension -eq ".sln" -and (Select-String -Path $project.FullName -Pattern ".csproj" -Quiet))) {
            # --- C# (.NET) Compilation Mode ---
            dotnet build $($project.FullName) -c Release `
              /p:Deterministic=true `
              /p:PathMap="${{ github.workspace }}==C:\StealthSource" `
              /p:DebugSymbols=false `
              /p:DebugType=none `
              /p:GenerateAssemblyInfo=false `
              /p:PublishSingleFile=true `
              /p:SelfContained=false
        } else {
            # --- C++ (MSBuild) Compilation Mode ---
            msbuild $($project.FullName) /p:Configuration=Release /p:Platform=x64 `
              /p:DebugInformationFormat=None `
              /p:LinkIncremental=false `
              /p:WholeProgramOptimization=true
        }

    - name: 6. Post-Processing (Strip UAC & Mask Executable)
      shell: pwsh
      run: |
        $exeFile = Get-ChildItem -Path . -Filter "*.exe" -Recurse | Where-Object { $_.FullName -notlike "*obj*" } | Select-Object -First 1
        if (-not $exeFile) {
            Write-Error "Critical Error: Output executable not found!"
            exit 1
        }
        
        Write-Host "Target binary found: $($exeFile.FullName)"
        
        # Inject manifest via mt.exe to bypass UAC prompts
        & "mt.exe" -manifest "stealth.manifest" -outputresource:"$($exeFile.FullName);#1"
        Write-Host "UAC security requirements stripped successfully."
        
        # Mask the file as a core system component
        $maskedName = "conhost_win.exe" 
        $destination = Join-Path (Get-Item .).FullName $maskedName
        Move-Item -Path $exeFile.FullName -Destination $destination -Force
        
        Write-Host "Binary processing completed. Target saved as: $maskedName"

    - name: 7. Upload Stealth Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Core-Package
        path: ./\*conhost_win.exe
        retention-days: 1

name: Build EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install pyinstaller pymem pywin32 imgui glfw PyOpenGL requests

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --console --name "ESP_Tester" main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ESP_Tester_EXE
        path: dist/ESP_Tester.exe

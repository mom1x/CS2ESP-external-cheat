name: Build EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Dynamic Build with PyInstaller
      shell: powershell
      run: |
        # Ищем любой .py файл в корне, кроме конфигурационных
        $pyFile = Get-ChildItem -Filter *.py | Where-Object { $_.Name -notmatch "setup|settings" } | Select-Object -First 1
        
        if ($null -eq $pyFile) {
            Write-Error "Критическая ошибка: В корне репозитория не найден ни один Python-скрипт (.py)!"
            exit 1
        }
        
        Write-Host "Найден файл для сборки: $($pyFile.Name)"
        
        # Запускаем сборку найденного файла
        pyinstaller --noconfirm --onefile --windowed --name "ESP_Overlay" $pyFile.Name
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Executable
        path: dist/ESP_Overlay.exe

name: Build EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pymem pywin32 imgui glfw PyOpenGL requests

    - name: Build with PyInstaller (Smart Auto-Detect)
      shell: powershell
      run: |
        # Ищем любой .py файл в корне, исключая конфигурационные файлы гитхаба
        $pyFile = Get-ChildItem -Filter *.py | Select-Object -First 1
        
        if ($null -eq $pyFile) {
            Write-Error "Критическая ошибка: В корне репозитория не найден ни один Python-скрипт (.py)!"
            exit 1
        }
        
        Write-Host "Обнаружен файл для сборки: $($pyFile.Name)"
        
        # Запуск сборки найденного файла
        pyinstaller --noconfirm --onefile --console --name "ESP_Tester" $pyFile.Name

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ESP_Tester_EXE
        path: dist/ESP_Tester.exe

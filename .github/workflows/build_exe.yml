name: Build EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pymem pywin32 imgui glfw PyOpenGL requests numpy

    - name: Build Clean Stable Package
      run: |
        pyinstaller --noconfirm --onefile --console --collect-data glfw --collect-data imgui --collect-data numpy --name "ESP_Tester" CS2ESP.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ESP_Tester_EXE
        path: dist/ESP_Tester.exe

name: Build CS2ESP (resilient, no admin)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Update dumper links to the latest
      run: |
        $offsetsUrl = 'https://raw.githubusercontent.com/a2x/cs2-dumper/main/output/offsets.json'
        $clientDllUrl = 'https://raw.githubusercontent.com/a2x/cs2-dumper/main/output/client_dll.json'
        (Get-Content CS2ESP.py) -replace 'https://raw\.githubusercontent\.com/a2x/cs2-dumper/main/output/offsets\.json', $offsetsUrl | Set-Content CS2ESP.py
        (Get-Content CS2ESP.py) -replace 'https://raw\.githubusercontent\.com/a2x/cs2-dumper/main/output/client_dll\.json', $clientDllUrl | Set-Content CS2ESP.py
        Write-Host "Links updated."

    - name: Fix requirements.txt (win32 -> pywin32)
      run: |
        (Get-Content requirements.txt) -replace '^win32$', 'pywin32' | Set-Content requirements.txt
        Write-Host "requirements.txt fixed."

    - name: Download GLFW3 DLL (official, 64-bit)
      run: |
        $url = "https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.bin.WIN64.zip"
        Invoke-WebRequest -Uri $url -OutFile glfw.zip
        Expand-Archive glfw.zip -DestinationPath glfw_extracted
        Copy-Item "glfw_extracted\glfw-3.4.bin.WIN64\lib-vc2022\glfw3.dll" -Destination "glfw3.dll"
        Write-Host "glfw3.dll placed in root."

    - name: Patch CS2ESP.py (add logging and safe reads)
      run: |
        # Блок с импортами и функцией log_error
        $logBlock = @'
        import sys, os, traceback, datetime
        log_file = open(os.path.join(os.path.dirname(sys.executable), "cs2esp_errors.log"), "a", encoding="utf-8")
        def log_error(msg):
            timestamp = datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S")
            log_file.write(f"[{timestamp}] {msg}\n")
            log_file.flush()
        '@

        # Блок с безопасными функциями чтения
        $safeFuncs = @'
        def safe_read(pm, address):
            try:
                if address < 0x10000 or address > 0x7FFFFFFFFFFF:
                    raise ValueError(f"Invalid address: {hex(address)}")
                return pm.read_longlong(address)
            except Exception as e:
                log_error(f"safe_read failed at {hex(address)}: {e}")
                return 0

        def safe_read_int(pm, address):
            try:
                if address < 0x10000 or address > 0x7FFFFFFFFFFF:
                    raise ValueError(f"Invalid address: {hex(address)}")
                return pm.read_int(address)
            except Exception as e:
                log_error(f"safe_read_int failed at {hex(address)}: {e}")
                return 0

        def safe_read_float(pm, address):
            try:
                if address < 0x10000 or address > 0x7FFFFFFFFFFF:
                    raise ValueError(f"Invalid address: {hex(address)}")
                return pm.read_float(address)
            except Exception as e:
                log_error(f"safe_read_float failed at {hex(address)}: {e}")
                return 0.0
        '@

        $script = Get-Content CS2ESP.py -Raw
        # Вставляем log_block в самое начало
        $script = $logBlock + "`n" + $script
        # Вставляем safe functions после строки с import pymem
        $script = $script -replace "(import pymem\b.*)", "`$1`n" + $safeFuncs
        # Заменяем опасные вызовы чтения на безопасные
        $script = $script -replace 'pm\.read_longlong\(', 'safe_read(pm, '
        $script = $script -replace 'pm\.read_int\(', 'safe_read_int(pm, '
        $script = $script -replace 'pm\.read_float\(', 'safe_read_float(pm, '
        Set-Content CS2ESP.py -Value $script
        Write-Host "Script patched with safe reads and logging."

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE with PyInstaller (no admin)
      run: |
        pyinstaller --onefile --windowed --name CS2ESP --add-binary "glfw3.dll;." CS2ESP.py

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: CS2ESP-exe
        path: dist/CS2ESP.exe

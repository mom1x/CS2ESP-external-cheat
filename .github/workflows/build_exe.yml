name: Build EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Ultimate Build with PyInstaller
      shell: powershell
      run: |
        # Автоматический поиск твоего главного скрипта на сервере
        $pyFile = Get-ChildItem -Filter *.py | Where-Object { $_.Name -notmatch "setup|settings" } | Select-Object -First 1
        
        if ($null -eq $pyFile) {
            Write-Error "Критическая ошибка: В корне репозитория не найден Python-скрипт!"
            exit 1
        }
        
        Write-Host "Успешно нашли файл для сборки: $($pyFile.Name)"
        
        # --collect-all glfw на 100% забирает все dll файлы библиотеки glfw внутрь одного exe
        pyinstaller --noconfirm --onefile --windowed --collect-all glfw --name "ESP_Overlay" $pyFile.Name
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Executable
        path: dist/ESP_Overlay.exe

name: Python Executable Safe Compiler

on:
  workflow_dispatch: # Запуск вручную через вкладку Actions

jobs:
  build_exe:
    runs-on: windows-latest

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Оптимальная версия для стабильной работы PyOpenGL и ImGui

    - name: 3. Install Dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        
        if (Test-Path "requirements.txt") {
            (Get-Content requirements.txt) -replace '^win32$', 'pywin32' | Out-File requirements.txt -Encoding utf8
            pip install -r requirements.txt
        } else {
            pip install pymem pywin32 glfw imgui[full] PyOpenGL requests
        }
        
        pip install pyinstaller

    - name: 4. Compile Project via PyInstaller
      shell: pwsh
      run: |
        $mainScript = Get-ChildItem -Path . -Filter "*.py" | Select-Object -First 1
        if (-not $mainScript) {
            Write-Error "Critical Error: Python script (.py) not found in repository!"
            exit 1
        }
        
        Write-Host "Compiling script: $($mainScript.FullName)"
        
        # Добавлен флаг --collect-binaries glfw, который принудительно зашьет glfw3.dll внутрь exe
        pyinstaller --onefile --noconsole --collect-binaries glfw --name="conhost_win" $($mainScript.FullName)

    - name: 5. Upload Compiled Executable
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Executable-Package
        path: dist/conhost_win.exe
        retention-days: 1

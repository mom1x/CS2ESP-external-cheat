name: Build ESP Project

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest # Важно: собираем именно на Windows, чтобы не было проблем с путями

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pymem pywin32 glfw PyOpenGL PyOpenGL-accelerate imgui[glfw] pyinstaller

    - name: Build with PyInstaller
      run: |
        # Главный секрет: --hidden-import для платформы OpenGL и отключение UAC-требований
        pyinstaller --onefile --noconsole --hidden-import=OpenGL.platform.win32 --name CS2ESP CS2ESP.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CS2ESP-Build
        path: dist/CS2ESP.exe

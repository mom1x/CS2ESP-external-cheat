name: Build CS2ESP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Теперь файл requirements.txt уже правильный, ставим напрямую
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Download GLFW3 DLL
      run: |
        curl -L -o glfw.zip https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.bin.WIN64.zip
        tar -xf glfw.zip
        copy "glfw-3.4.bin.WIN64\lib-vc2022\glfw3.dll" .

    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name CS2ESP ^
        --hidden-import=requests ^
        --hidden-import=pymem ^
        --add-binary "glfw3.dll;." ^
        launcher.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CS2ESP-Build
        path: dist/CS2ESP.exe

name: Build EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Dynamic Build with PyInstaller and GLFW Fix
      shell: powershell
      run: |
        # Автоматический поиск имени твоего скрипта (например, CS2ESP.py)
        $pyFile = Get-ChildItem -Filter *.py | Where-Object { $_.Name -notmatch "setup|settings" } | Select-Object -First 1
        
        if ($null -eq $pyFile) {
            Write-Error "Критическая ошибка: В корне не найден Python-скрипт!"
            exit 1
        }
        
        Write-Host "Собираем файл: $($pyFile.Name)"
        
        # Сборка с принудительным включением всех динамических библиотек glfw
        pyinstaller --noconfirm --onefile --windowed --collect-dynamic-libs glfw --name "ESP_Overlay" $pyFile.Name
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Executable
        path: dist/ESP_Overlay.exe

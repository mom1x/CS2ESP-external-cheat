name: Ultimate Anonymous Compiler Pro

on:
  workflow_dispatch: # Запуск вручную кнопкой в панели Actions

jobs:
  stealth_build:
    runs-on: windows-latest

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Setup MSBuild (For C++)
      uses: microsoft/setup-msbuild@v2

    - name: 3. Setup .NET Runtime (For C#)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x' # Автоматически поддерживает большинство современных проектов

    - name: 4. Auto-Generate Clean Manifest (No UAC)
      shell: powershell
      run: |
        # Генерируем манифест прямо во время сборки, чтобы не хранить его в репо
        $manifestContent = @"
        <?xml version="1.0" encoding="utf-8"?>
        <assembly manifestVersion="1.0" xmlns="urn:schemas-microsoft-com:asm.v1">
          <assemblyIdentity version="1.0.0.0" name="Microsoft.Windows.Runtime"/>
          <trustInfo xmlns="urn:schemas-microsoft-com:asm.v2">
            <security>
              <requestedPrivileges xmlns="urn:schemas-microsoft-com:asm.v3">
                <requestedExecutionLevel level="asInvoker" uiAccess="false" />
              </requestedPrivileges>
            </security>
          </trustInfo>
        </assembly>
        "@
        $manifestContent | Out-File -FilePath "stealth.manifest" -Encoding utf8
        Write-Host "Скрытый манифест успешно сгенерирован."

    - name: 5. Detect and Compile Project (Anonymized)
      shell: powershell
      run: |
        # Ищем файлы проектов в репозитории
        $project = Get-ChildItem -Path . -Include *.sln, *.csproj, *.vcxproj -Recurse | Select-Object -First 1
        if (-not $project) {
            Write-Error "Критическая ошибка: Файл проекта (.sln, .csproj, .vcxproj) не найден в репозитории!"
            exit 1
        }
        
        Write-Host "Обнаружен проект: $($project.FullName)"
        Write-Host "Запуск глубокой анонимизации и компиляции..."

        if ($project.Extension -eq ".csproj" -or ($project.Extension -eq ".sln" -and (Select-String -Path $project.FullName -Pattern ".csproj" -Quiet))) {
            # --- СБОРКА ДЛЯ C# (.NET) ---
            dotnet build $($project.FullName) -c Release `
              /p:Deterministic=true `
              /p:PathMap="${{ github.workspace }}==C:\StealthSource" `
              /p:DebugSymbols=false `
              /p:DebugType=none `
              /p:GenerateAssemblyInfo=false `
              /p:PublishSingleFile=true `
              /p:SelfContained=false
        } else {
            # --- СБОРКА ДЛЯ C++ (MSBuild) ---
            msbuild $($project.FullName) /p:Configuration=Release /p:Platform=x64 `
              /p:DebugInformationFormat=None `
              /p:LinkIncremental=false `
              /p:WholeProgramOptimization=true `
              /p:攻击Path="" # Защита от некоторых старых видов логов компилятора
        }

    - name: 6. Post-Processing (Strip UAC & Mask Executable)
      shell: powershell
      run: |
        # Ищем готовый скомпилированный файл, игнорируя промежуточные папки obj
        $exeFile = Get-ChildItem -Path . -Filter "*.exe" -Recurse | Where-Object { $_.FullName -notlike "*obj*" } | Select-Object -First 1
        if (-not $exeFile) {
            Write-Error "Критическая ошибка: Компилятор не создал .exe файл!"
            exit 1
        }
        
        Write-Host "Исходный файл найден: $($exeFile.FullName)"
        
        # Принудительно заменяем манифест внутри файла на наш (без UAC)
        & "mt.exe" -manifest "stealth.manifest" -outputresource:"$($exeFile.FullName);#1"
        Write-Host "Права UAC успешно сброшены до уровня обычного пользователя (asInvoker)."
        
        # Маскируем под стандартный системный процесс Windows
        $maskedName = "conhost_win.exe" 
        $destination = Join-Path (Get-Item .).FullName $maskedName
        Move-Item -Path $exeFile.FullName -Destination $destination -Force
        
        Write-Host "Бинарник успешно замаскирован и очищен. Итоговый файл: $maskedName"

    - name: 7. Upload Stealth Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Core-Package # Полностью нейтральное имя архива на GitHub
        path: ./\*conhost_win.exe
        retention-days: 1 # Файл автоматически сотрется с серверов через 24 часа для безопасности
